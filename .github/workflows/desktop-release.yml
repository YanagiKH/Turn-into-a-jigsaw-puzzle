name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify required source files
        shell: pwsh
        run: |
          $required = @(
            'index.html',
            'renderer.js',
            'platform-bridge.js',
            'challenge-mode.js',
            'challenge.css',
            'mods/aurora-theme/index.js',
            'mods/index.json'
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Missing required source file: $item"
            }
          }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify Windows installer and packaged features
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced' }
          if ($installer.Length -lt 5MB) { throw "Windows installer is unexpectedly small: $($installer.Length) bytes" }

          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip t $installer.FullName | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer archive verification failed' }
          }

          $asarPath = 'dist/win-unpacked/resources/app.asar'
          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) {
            throw 'Windows app.asar was not produced'
          }

          $asarOutput = & npx --no-install asar list $asarPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Windows app.asar' }

          $asarEntries = @($asarOutput | ForEach-Object {
            $normalized = ($_ -replace '\\', '/')
            $normalized = ($normalized -replace '^/+', '')
            $normalized.Trim()
          })

          $required = @(
            'index.html',
            'renderer.js',
            'platform-bridge.js',
            'challenge-mode.js',
            'challenge.css',
            'mods/aurora-theme/index.js',
            'mods/index.json'
          )
          foreach ($item in $required) {
            if ($asarEntries -notcontains $item) {
              Write-Host 'Packaged ASAR entries:'
              $asarEntries | Sort-Object | Out-Host
              throw "Missing packaged feature: $item"
            }
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify required source files
        run: |
          for required in \
            index.html \
            renderer.js \
            platform-bridge.js \
            challenge-mode.js \
            challenge.css \
            mods/aurora-theme/index.js \
            mods/index.json; do
            test -f "$required"
          done

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Verify Linux AppImage and packaged features
        run: |
          appimage=$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          test -s "$appimage"
          chmod +x "$appimage"
          file "$appimage" | grep -E 'ELF|executable'

          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          asar_path='squashfs-root/resources/app.asar'
          test -s "$asar_path"

          npx --no-install asar list "$asar_path" \
            | sed -e 's#\\#/#g' -e 's#^/*##' \
            | sed '/^[[:space:]]*$/d' \
            > asar-list.txt

          for required in \
            index.html \
            renderer.js \
            platform-bridge.js \
            challenge-mode.js \
            challenge.css \
            mods/aurora-theme/index.js \
            mods/index.json; do
            if ! grep -Fqx "$required" asar-list.txt; then
              echo "Missing packaged feature: $required"
              sort asar-list.txt
              exit 1
            fi
          done

          sha256sum "$appimage" > "$appimage.sha256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  release:
    needs: [build_windows, build_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: artifacts/linux

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="desktop-${GITHUB_SHA::7}"
          fi
          mapfile -t assets < <(find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.sha256' \) | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GH_REPO" --title "$tag" --notes "Verified desktop builds for Windows and Linux"
          fi
