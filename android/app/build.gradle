plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yanagikh.jigsaw'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yanagikh.jigsaw'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

def webRoot = rootProject.file('..')
def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')

tasks.register('syncWebAssets', Copy) {
    from(webRoot) {
        include 'index.html'
        include 'styles.css'
        include 'mobile.css'
        include 'renderer.js'
        include 'pwa.js'
        include 'sw.js'
        include 'manifest.webmanifest'
        include 'assets/icon.svg'
    }
    into(generatedWebAssets)
}

preBuild.dependsOn(tasks.named('syncWebAssets'))
android.sourceSets.main.assets.srcDirs += [generatedWebAssets.get().asFile]

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
